[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayes-nn"
version = "0.2.0"
description = "Bayesian Neural Networks with MOPED conversion from deterministic CNNs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "torchmetrics",
    "click",
    "tqdm",
    "matplotlib",
]

[tool.setuptools]
py-modules = ["config", "evaluate", "train", "tune", "convert", "converter", "moped"]
packages = ["models", "utils"]

[project.scripts]
moped-convert = "convert:main"