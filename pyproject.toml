[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bayes-nn"
version = "0.1.0"
description = "Bayesian Neural Networks with MOPED conversion from deterministic CNNs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "torchmetrics",
    "click",
    "tqdm",
    "matplotlib",
]

[project.scripts]
moped-convert = "convert:main"