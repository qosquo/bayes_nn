model:
  name: lenet_emnist-letters_baseline
  num_classes: 26
  rho_init: -3

data:
  dataset: EMNIST
  kwargs:
    split: letters
  batch_size: 128
  num_workers: 1

training:
  epochs: 100
  learning_rate: 0.00039459088111000007
  gradient_clip_norm: 1.0
  t_train: 1
  mc_samples: 10
  beta_schedule: blundell
  warmup_epochs: 10

prior:
  sigma1: 0.1570959187646975
  sigma2: 0.002414589159115087
  pi: 0.6633468615779945

scheduler:
  type: reduce_on_plateau
  patience: 6
